name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run typecheck
      - name: Vitest and architecture gates
        run: npm run test
      - name: Domain, compatibility, and production sanity scanners
        run: npx vitest run src/core/quality src/core/compatibility
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - name: Diff check
        run: git diff --check
